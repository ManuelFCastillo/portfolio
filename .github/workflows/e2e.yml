name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the badge on the site be refreshed on demand.
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Only Chromium is used, by both the desktop and mobile projects.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end suite
        run: npx playwright test

      # Publishes the real result into public/, then rebuilds so the deployable
      # output carries it. The badge on the site then costs zero API calls and
      # cannot be rate-limited for visitors behind a shared IP.
      - name: Publish CI status and résumé PDF into the site
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci-status.mjs
          cat public/ci-status.json
          npm run resume:pdf
          npm run build

      - name: Upload deployable build
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: site
          path: |
            .next/
            public/
          retention-days: 7

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: test-results/
          retention-days: 14
